    <!-- Leaflet CSS & JS for Interactive Map Picker -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Dynamic Midtrans Snap SDK Loader -->
    <script type="text/javascript">
      (function() {
        var clientKey = "%VITE_MIDTRANS_CLIENT_KEY%";
        var isClientKeySet = clientKey && !clientKey.startsWith("%");
        var isProd = "%VITE_MIDTRANS_IS_PRODUCTION%" === "true" || (isClientKeySet && clientKey.indexOf("Mid-client-") === 0);
        var snapUrl = isProd 
          ? "https://app.midtrans.com/snap/snap.js" 
          : "https://app.sandbox.midtrans.com/snap/snap.js";
        var script = document.createElement("script");
        script.id = "midtrans-snap-sdk";
        script.type = "text/javascript";
        script.src = snapUrl;
        if (isClientKeySet) {
          script.setAttribute("data-client-key", clientKey);
        }
        document.head.appendChild(script);
      })();
    </script>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('kosmo_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>KOSMO - Premium Co-living Bali</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
